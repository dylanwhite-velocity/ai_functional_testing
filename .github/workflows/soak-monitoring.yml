# Soak Monitoring Workflow
# Runs the full soak monitoring pipeline on a schedule:
#   1. Fetch Velocity item logs (API)             — needs Secrets Manager
#   2. Fetch Kubernetes pod logs (kubectl)         — needs EKS access (eks-admin role)
#   3. Generate summary report (Azure OpenAI)     — needs Secrets Manager
#   4. Upload report as GitHub Actions artifact
#
# AWS setup:
#   Secrets Manager uses the dwhite-cli IAM user (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
#   in account 591949011095.
#   EKS access uses a separate IAM user (AWS_EKS_ACCESS_KEY_ID / AWS_EKS_SECRET_ACCESS_KEY)
#   in the EKS account (199613768778) with direct cluster access.
#   Kubeconfig is generated dynamically via `aws eks update-kubeconfig`.
#
# Trigger: Daily cron schedule + manual dispatch
#
# Required GitHub Secrets:
#   AWS_ACCESS_KEY_ID          - IAM access key for Secrets Manager (account 591949011095)
#   AWS_SECRET_ACCESS_KEY      - IAM secret key for Secrets Manager
#   AWS_EKS_ACCESS_KEY_ID      - IAM access key for EKS (authorized to assume eks-admin)
#   AWS_EKS_SECRET_ACCESS_KEY  - IAM secret key for EKS

name: Soak Monitoring

on:
  # Every 8 hours (7 AM, 3 PM, 11 PM UTC / 12 AM, 8 AM, 4 PM MST)
  schedule:
    - cron: '0 7,15,23 * * *'

  # Manual trigger with optional overrides
  workflow_dispatch:
    inputs:
      velocity_hours:
        description: 'Hours to look back for Velocity logs (default: from config)'
        required: false
        type: number
      pod_hours:
        description: 'Hours to look back for pod logs (default: from config)'
        required: false
        type: number
      item_type:
        description: 'Filter by item type'
        required: false
        type: choice
        options:
          - all
          - feeds
          - rats
          - bats
      dry_run:
        description: 'Dry run (skip OpenAI API call)'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-west-2
  PYTHONPATH: ${{ github.workspace }}

jobs:
  soak-monitor:
    name: Run Soak Monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install ".[soak-monitoring]"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.3'

      # ─────────────────────────────────────────────────────
      # AWS Credentials (single identity for all steps)
      # ─────────────────────────────────────────────────────
      - name: Debug AWS credentials
        run: |
          KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
          SECRET="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "Access Key ID length: ${#KEY_ID}"
          echo "Access Key ID prefix: ${KEY_ID:0:4}..."
          echo "Secret Key length: ${#SECRET}"
          # Validate format
          if [[ ! "$KEY_ID" =~ ^AKIA[A-Z0-9]{16}$ ]]; then
            echo "::warning::Access Key ID does not match expected format (AKIA + 16 alphanumeric chars)"
          fi
          if [[ ${#SECRET} -ne 40 ]]; then
            echo "::warning::Secret Access Key length is ${#SECRET}, expected 40"
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ─────────────────────────────────────────────────────
      # Step 1: Fetch Velocity item logs (Secrets Manager)
      # ─────────────────────────────────────────────────────

      - name: 'Step 1: Fetch Velocity item logs'
        working-directory: soak-monitoring-logs
        run: |
          CMD="python src/get_velocity_item_logs.py --config environments.yaml"
          if [[ "${{ inputs.velocity_hours }}" != "" ]]; then
            CMD="$CMD --hours ${{ inputs.velocity_hours }}"
          fi
          if [[ "${{ inputs.item_type }}" != "" && "${{ inputs.item_type }}" != "all" ]]; then
            CMD="$CMD --type ${{ inputs.item_type }}"
          fi
          echo "Running: $CMD"
          eval $CMD

      - name: Locate velocity errors file
        id: velocity
        working-directory: soak-monitoring-logs
        run: |
          FILE=$(ls -t logs/velocity_errors_*.json 2>/dev/null | head -1)
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          if [[ -z "$FILE" ]]; then
            echo "::error::No velocity_errors JSON found"
            exit 1
          fi
          echo "Found: $FILE"

          # Check if there are errors worth investigating
          TOTAL=$(python3 -c "import json; d=json.load(open('$FILE')); print(d.get('summary',{}).get('total_items_with_errors',0))")
          echo "errors=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "Items with errors: $TOTAL"

      # ─────────────────────────────────────────────────────
      # Step 2: Fetch Kubernetes pod logs (EKS)
      # ─────────────────────────────────────────────────────
      - name: Configure AWS – EKS
        if: steps.velocity.outputs.errors != '0'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_EKS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_EKS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubeconfig
        if: steps.velocity.outputs.errors != '0'
        run: |
          # Extract EKS cluster mappings (cluster_name -> context alias) from environments.yaml
          python3 << 'PYSCRIPT' > /tmp/eks_clusters.txt
          import yaml
          with open('soak-monitoring-logs/environments.yaml') as f:
              config = yaml.safe_load(f)
          seen = set()
          for inst in config.get('instances', []):
              name = inst.get('name')
              cluster = inst.get('cluster_name', name)
              key = f"{cluster}:{name}"
              if name and key not in seen:
                  seen.add(key)
                  print(f"{cluster} {name}")
          PYSCRIPT

          echo "Cluster mappings:"
          cat /tmp/eks_clusters.txt

          while read -r CLUSTER ALIAS; do
            echo "--- Updating kubeconfig: cluster=$CLUSTER alias=$ALIAS"
            aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name "$CLUSTER" --alias "$ALIAS"
          done < /tmp/eks_clusters.txt

          echo "Available contexts:"
          kubectl config get-contexts -o name

      - name: Verify cluster access
        if: steps.velocity.outputs.errors != '0'
        run: |
          for ctx in $(kubectl config get-contexts -o name); do
            echo "Testing context: $ctx"
            kubectl --context "$ctx" cluster-info --request-timeout=10s 2>&1 | head -2 || echo "  WARNING: Cannot reach $ctx"
          done

      - name: 'Step 2: Fetch Kubernetes pod logs'
        if: steps.velocity.outputs.errors != '0'
        working-directory: soak-monitoring-logs
        run: |
          CMD="python src/get_pod_logs_for_errors.py ${{ steps.velocity.outputs.file }} --config environments.yaml"
          if [[ "${{ inputs.pod_hours }}" != "" ]]; then
            CMD="$CMD --hours ${{ inputs.pod_hours }}"
          fi
          echo "Running: $CMD"
          eval $CMD

      - name: Skip pod logs (no errors)
        if: steps.velocity.outputs.errors == '0'
        run: echo "No items with errors — skipping pod log collection."

      # ─────────────────────────────────────────────────────
      # Step 3: Generate report (Secrets Manager for API key)
      # ─────────────────────────────────────────────────────
      - name: Configure AWS – Secrets Manager (report)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare pod logs for report
        id: podlogs
        working-directory: soak-monitoring-logs
        run: |
          POD_FILE=$(ls -t logs/pod_logs_*.json 2>/dev/null | head -1)
          if [[ -z "$POD_FILE" ]]; then
            # No pod logs (healthy environment) — create an empty placeholder
            TS=$(date +%Y%m%d_%H%M%S)
            POD_FILE="logs/pod_logs_${TS}_empty.json"
            echo '{"generated_at":"'"$(date -Iseconds)"'","summary":{"items_processed":0,"items_with_pods":0,"total_pods_analyzed":0,"total_pod_errors":0},"items":[]}' > "$POD_FILE"
            echo "Created empty pod logs placeholder: $POD_FILE"
          fi
          echo "file=$POD_FILE" >> "$GITHUB_OUTPUT"

      - name: 'Step 3: Generate report'
        working-directory: soak-monitoring-logs
        run: |
          CMD="python src/generate_report.py"
          CMD="$CMD --velocity-errors ${{ steps.velocity.outputs.file }}"
          CMD="$CMD --pod-logs ${{ steps.podlogs.outputs.file }}"
          CMD="$CMD --config environments.yaml"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            CMD="$CMD --dry-run"
          fi
          echo "Running: $CMD"
          eval $CMD

      # ─────────────────────────────────────────────────────
      # Artifacts & Summary
      # ─────────────────────────────────────────────────────
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-monitoring-report-${{ github.run_number }}
          path: |
            soak-monitoring-logs/logs/report_*.md
            soak-monitoring-logs/logs/velocity_errors_*.json
            soak-monitoring-logs/logs/pod_logs_*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Print report summary
        if: always()
        working-directory: soak-monitoring-logs
        run: |
          REPORT=$(ls -t logs/report_*.md 2>/dev/null | head -1)
          if [[ -n "$REPORT" ]]; then
            echo "## Soak Monitoring Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "$REPORT" >> $GITHUB_STEP_SUMMARY
          else
            echo "## No report generated" >> $GITHUB_STEP_SUMMARY
            echo "Check the workflow logs for errors." >> $GITHUB_STEP_SUMMARY
          fi
