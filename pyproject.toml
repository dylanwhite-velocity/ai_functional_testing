[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-functional-testing"
version = "0.1.0"
description = "AI-powered functional testing framework for ArcGIS Velocity"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Esri", email = "velocity@esri.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0.0",
    "boto3>=1.28.0",
    "botocore>=1.31.0",
    "loguru>=0.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "boto3-stubs[secretsmanager]>=1.28.0",
]
mcp = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]
soak-monitoring = [
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
]

[project.urls]
Repository = "https://devtopia.esri.com/WebGIS/ai-functional-testing"

[tool.hatch.build.targets.wheel]
packages = ["common", "arcgis-velocity-mcp", "testrail-mcp", "soak-monitoring-logs"]

[tool.pytest.ini_options]
testpaths = ["common", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
